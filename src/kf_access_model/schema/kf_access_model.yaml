---
id: https://w3id.org/carrollaboratory/kf-access-model
name: kf-access-model
title: kf-access-model
description: |-
  Internal Access model for the Kids First Data Resource Center.

  This schema creates a base access model for the Kids First program, attempting to combine both the common-access-model and the KF Dataservice.
license: MIT
see_also:
  - https://carrollaboratory.github.io/kf-access-model

prefixes:
  kidsfirst: https://w3id.org/carrollaboratory/kf-access-model/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
  cam: https://includedcc.org/common-access-model/
 # subset of CDC Race and Ethnicity Code Set Version 1.0
  cdc_race_eth: urn:oid:2.16.840.1.113883.6.238/
  hl7_null: http://terminology.hl7.org/CodeSystem/v3-NullFlavor/
  ig_dob_method: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/research-data-date-of-birth-method/
  igcondtype: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/condition-type/
  ig2dac: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/research-data-access-code/
  ig2dat: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/research-data-access-type/
  ig2_biospecimen_availability: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/biospecimen-availability/
  snomed_ct: http://snomed.info/id/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  mesh: http://id.nlm.nih.gov/mesh/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  DUO: http://purl.obolibrary.org/obo/DUO_
  loinc: https://loinc.org/
  KIN: http://purl.org/ga4gh/kin.owl#

default_prefix: kidsfirst
default_range: string

imports:
  - linkml:types
  # - common_access_model/src/common_access_model/schema/common_access_model



types:
  kfID:
    uri: xsd:string
    base: str
    description: KF dataservice identifier for a record, eg, PT_00000000, BS_00000000, etc.
  ptGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle pt global ID. For FHIR Patient Resources.
  obGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle ob global ID. For FHIR Observation Resources.
  lsGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle ls global ID. For FHIR List Resources.
  orGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle or global ID. For FHIR Organization Resources.
  grGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle gr global ID. For FHIR Group Resources.
  sdGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle sd global ID. For FHIR ResearchStudy Resources.
  deGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle de global ID. For FHIR Device Resources.
  bsGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle bs global ID. For FHIR Specimen Resources.
  adGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle ad global ID. For FHIR ActivityDefinition Resources.
  drGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle dr global ID. For FHIR DocumentReference Resources.
  enGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle en global ID. For FHIR Encounter Resources.
  coGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle co global ID. For FHIR Consent Resources.
  diGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle di global ID. For FHIR Diagnostic Report Resources.


# To be created
  fmGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle __ global ID. For FHIR FamilyMemberHistory Resources.
  pdGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle __ global ID. For FHIR PlanDefinition Resources.
  msGlobalID:
    uri: xsd:string
    base: str
    description: Dewrangle __ global ID. For FHIR MedicationStatement Resources.

classes:
  Any:
      class_uri: linkml:Any
  Record:
    description: One row / entity within the dataservice
    title: Record
    abstract: true
    slots:
    - kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - external_id
    - study_id
    slot_usage:
      kf_id:
        range: kfID
        required: true
        identifier: true

  Study:
    title: Research Study 
    description: Study Metadata 
    is_a: Record
    slots: 
      - parent_study 
      - study_title
      - study_code
      - study_short_name
      - program
      - funding_source
      - principal_investigator 
      - contact
      - study_description
      - website
      # - publication
      - acknowledgments
      - citation_statement
      # - do_id

      # KF fields
      # - data_access_authority -- always mapped to dbGaP in KF
      - version
      - attribution
      - domain
      - status
    slot_usage:
      parent_study:
        description: The parent KFStudy for this study, if it is a nested study.
        range: Study
      principal_investigator:
        description: The KFInvestigator(s) responsible for the study.
        range: Investigator
      contact:
        description: The KFInvestigator(s) to contact with questions about this study.
        range: Investigator

  Investigator:
    title: Investigator
    description: An individual who made contributions to the collection, analysis, or sharing of data.
    is_a: Record
    slots:
      - name
      - institution
      - investigator_title
      - email

  Subject:
    title: Subject
    description: This entity is the subject about which data or references are recorded. 
      This includes the idea of a human participant in a study, a cell line, an animal model, 
      or any other similar entity.
    is_a: Record
    slots:
      - subject_id
      - subject_type
      - organism_type
      - sex
      - race
      - ethnicity
      - age_at_last_vital_status 
      - vital_status
      - age_at_first_engagement

      # KF Fields
      - family_id
      - is_proband
      - affected_status
    slot_usage:
      subject_id:
        range: ptGlobalID

  Family:
    title: Family
    description: A group of individuals of some relation who are grouped together in a study.
    is_a: Record
    slots:
    - family_id
    - family_type
    - family_description 
    - consanguinity
    - family_study_focus
    slot_usage:
      family_id:
        range: grGlobalID
  FamilyRelationship:
    title: Family Member Relationship
    description: A relationship between two Subjects. Directed as follows
     <family_member_id> <relationship> <subject_id>
     <Mother's id> <KIN:027 "isBiologicalMotherOf"> <subject_id> 
    is_a: Record
    slots:
    - family_relationship_id
    - family_member_id
    - relation
    - subject_id
    slot_usage:
      family_relationship_id:
        range: fmGlobalID
      subject_id:
        required: true
        description: The family member Subject who is the relationship "object".

  SubjectAssertion:
    title: Subject Assertion 
    description: Assertion about a particular Subject. Diagnoses, Phenotypes, and other clinical observations can be recorded as Subject Assertions.
    is_a: Record 
    slots:
      - assertion_id
      - subject_id
      # - encounter_id
      - assertion_provenance
      - age_at_assertion
      - age_at_event
      - age_at_resolution
      - concept
      - concept_source
      - value_concept
      - value_number
      - value_source
      - value_unit
      - value_unit_source
    slot_usage:
      assertion_id:
        range: obGlobalID
        any_of:
         - range: deGlobalID
         - range: msGlobalID

# Added new class for KF Assertion to allow for values relateed to tumor/cancer data
  KFSubjectAssertion:
    title: Subject Assertion
    description: A Subject Assertion recorded for a Participant.
    is_a: SubjectAssertion
    slots:
      - source_text_tumor_location
      - uberon_id_tumor_location
      - spatial_descriptor
      - diagnosis_category
      - disease_related
      - vital_status
  Concept:
    title: Concept
    description: A standardized concept with display information.
    slots:
      - concept_curie 
      - display
    slot_usage:
      concept_curie:
        required: true
        identifier: true

  Sample:
    title: Sample 
    description: A grouping of Biospecimens collected from a Participant at the same event.
    is_a: Record
    slots: 
      - sample_id
      - biospecimen_collection_id 
      - parent_sample_id 
      - sample_type
      - processing 
      - availablity_status 
      - storage_method 
      - quantity_number
      - quantity_unit 
    slot_usage:
      sample_id:
        range: bsGlobalID
      biospecimen_collection_id:
        description: Biospecimen Collection during which this sample was generated.

  BiospecimenCollection:
    title: BiospecimenCollection
    description: A biospecimen collection event which yields one or more Samples.
    is_a: Record 
    slots: 
      - biospecimen_collection_id
      - age_at_collection
      - method 
      - site 
      - spatial_qualifier 
      - laterality 
      # - encounter_id
    slot_usage:
      biospecimen_collection_id:
        range: string

  Aliquot:
    title: Aliquot
    description: A specific specimen/aliquot derived from a Sample, carrying
      material, consent, and shipment details.
    is_a: Record 
    slots: 
      - aliquot_id
      - sample_id
      - availablity_status
      - quantity_number
      - quantity_unit 
      - concentration_number
      - concentration_unit

      # KF Fields
      - has_matched_normal_sample
      - cell_entity
      - external_aliquot_id
      - sequencing_center_id
      - subject_id
      - external_sample_id
      - source_text_tissue_type
      - composition
      # - source_text_anatomical_site
      # - age_at_event_days
      - source_text_tumor_descriptor
      - ncit_id_tissue_type
      - ncit_id_anatomical_site
      - uberon_id_anatomical_site
      - spatial_descriptor
      - shipment_origin
      - shipment_date
      - analyte_type
      # - concentration_mg_per_ml
      # - volume_ul
      - specimen_status
      # - method_of_sample_procurement
      - dbgap_consent_code
      - consent_type
    slot_usage:
      aliquot_id:
        range: string

  GenomicFile:
    title: File
    description: A data file generated by or associated with sequencing. 
    is_a: Record 
    slots: 
      - file_id
      - subject_id
      - sample_id
      - filename
      - format
      - file_extension
      - data_category
      - data_type
      - format
      - size
      - internal_uri 
      - release_uri
      - drs_uri
      - storage_class 
      - hash
      - availability
      # KF Fields
      - controlled_access
      - is_harmonized
      - acl
      - authz
      - reference_genome
      - workflow_type
      - workflow_tool
      - workflow_version
      - file_version_descriptor
    slot_usage:
      file_id:
        range: drGlobalID
      subject_id:
        multivalued: true
      sample_id:
        multivalued: true
      data_type:
        description: The type of data within this file.
        range: EnumGenomicFileDataType
      availability:
        description: Is or was this file available to users?
        range: EnumGenomicFileAvailability
  
  FileHash:
    title: File Hash
    description: Type and value of a file content hash.
    slots:
      - hash_type
      - hash_value

  Assay:
    title: Assay
    description: A specific assay that was performed on given subject(s) or sample(s).
    is_a: Record 
    slots: 
      - assay_id
      - subject_id
      - sample_id
      - file_id
      - assay_type
      - assay_source
    slot_usage:
      assay_id:
        range: diGlobalID
      file_id:
        multivalued: true
      subject_id:
        multivalued: true
      sample_id:
        multivalued: true
      assay_type:
        required: true

# Created a new class for SequencingAssay to allow for sequencing-specific metadata to be captured
  SequencingAssay:
    title: Sequencing Experiment Assay
    description: A sequencing experiment performed on a Biospecimen.
    is_a: Assay
    slots:
      - sequencing_center_id
      - library_name
      - experiment_date
      - experiment_strategy
      - library_strand
      - library_prep
      - library_selection
      - is_paired_end
      - platform
      - instrument_model
      - max_insert_size
      - mean_insert_size
      - mean_depth
      - total_reads
      - mean_read_length
      - target_capture_kit
      - read_pair_number
      - is_adapter_trimmed
      - adapter_sequencing


  ReadGroup:
    title: Read Group
    description: Sequencing read group (flow cell / lane) metadata.
    is_a: Record
    slots:
      - file_id
      - flow_cell
      - lane_number
      - quality_scale

#  This could just be an enum
  SequencingCenter:
    title: Sequencing Center
    description: An organization that performs sequencing for a study.
    is_a: Record
    slots:
      - name

  

# KF linking tables - do we need to include any of these?

  # KFBiospecimenGenomicFile:
  #   title: Biospecimen Genomic File
