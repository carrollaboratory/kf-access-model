---
id: https://w3id.org/carrollaboratory/kf-access-model
name: kf-access-model
title: kf-access-model
description: |-
  Internal Access model for the Kids First Data Resource Center.

  This schema creates a base access model for the Kids First program, attempting to combine both the common-access-model and the KF Dataservice.
license: MIT
see_also:
  - https://carrollaboratory.github.io/kf-access-model

prefixes:
  kidsfirst: 
    prefix_prefix: kidsfirst
    prefix_reference: https://w3id.org/carrollaboratory/kf-access-model/
  cam:
    prefix_prefix: cam
    prefix_reference: https://includedcc.org/common-access-model/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  CDCREC:
    prefix_prefix: CDCREC
    prefix_reference: urn:oid:2.16.840.1.113883.6.238/
  hl7_null:
    prefix_prefix: hl7_null
    prefix_reference: http://terminology.hl7.org/CodeSystem/v3-NullFlavor/
  snomedct:
    prefix_prefix: snomedct
    prefix_reference: http://snomed.info/id/
  MONDO:
    prefix_prefix: MONDO
    prefix_reference: http://purl.obolibrary.org/obo/MONDO_
  HP:
    prefix_prefix: HP
    prefix_reference: http://purl.obolibrary.org/obo/HP_
  mesh:
    prefix_prefix: mesh
    prefix_reference: http://id.nlm.nih.gov/mesh/
  NCIT:
    prefix_prefix: NCIT
    prefix_reference: http://purl.obolibrary.org/obo/NCIT_
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  DUO:
    prefix_prefix: DUO
    prefix_reference: http://purl.obolibrary.org/obo/DUO_
  loinc:
    prefix_prefix: loinc
    prefix_reference: https://loinc.org/
  KIN:
    prefix_prefix: KIN
    prefix_reference: http://purl.org/ga4gh/kin.owl#
  edam:
    prefix_prefix: edam
    prefix_reference: http://edamontology.org
  OBI:
    prefix_prefix: OBI
    prefix_reference: http://purl.obolibrary.org/obo/OBI_
  MS:
    prefix_prefix: MS
    prefix_reference: http://purl.obolibrary.org/obo/MS_
  CHMO:
    prefix_prefix: CHMO
    prefix_reference: http://purl.obolibrary.org/obo/CHMO_
  NCBITaxon:
    prefix_prefix: NCBITaxon
    prefix_reference: http://purl.obolibrary.org/obo/NCBITaxon_
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  shex:
    prefix_prefix: shex
    prefix_reference: http://www.w3.org/ns/shex#

default_prefix: kidsfirst
default_range: string

imports:
  # - upstream-models/common_access_model
  - linkml:types
  - enums/EnumAssayType
  - enums/EnumAsserterType
  - enums/EnumAvailabilityStatus
  - enums/EnumDataCategory
  - enums/EnumDataSourceType
  - enums/EnumDataUseModifier
  - enums/EnumDataUsePermission
  - enums/EnumEDAMDataTypes
  - enums/EnumEDAMFormats
  - enums/EnumEthnicity
  - enums/EnumFamilyRelation
  - enums/EnumFamilyRole
  - enums/EnumFamilyType
  - enums/EnumFileHashType
  - enums/EnumLaterality
  - enums/EnumOrganism
  - enums/EnumParticipantLifespanStage
  - enums/EnumPresentAbsent
  - enums/EnumProgram
  - enums/EnumRace
  - enums/EnumResearchDomain
  - enums/EnumSampleCollectionMethod
  - enums/EnumSex
  - enums/EnumSite
  - enums/EnumSpatialQualifiers
  - enums/EnumStudyDesign
  - enums/EnumSubjectType
  - enums/EnumUnknown
  - enums/EnumUnknownOther
  - enums/EnumVitalStatus

