  # KFSequencingExperimentGenomicFile:
  #   title: Sequencing Experiment Genomic File
  #   description: Links a SequencingExperiment to a GenomicFile it produced.
  #   is_a: KFRecord
  #   slots:
  #     - sequencing_experiment_id
