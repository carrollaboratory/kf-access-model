---
id: https://w3id.org/carrollaboratory/kf-access-model
name: kf-access-model
title: kf-access-model
description: |-
  Internal Access model for the Kids First Data Resource Center.

  This schema profiles the common-access-model (cam) for data hosted in the
  Kids First Dataservice. Every Dataservice-sourced class descends from
  KFRecord (itself is_a cam:Record), which supplies the Dataservice's own
  kf_id identifier plus its per-record visibility/access-control fields.
  Where cam already models the concept (Investigator, Study, Family,
  FamilyRelationship, Sample), the corresponding KF class is_a KFRecord
  and also mixins the matching cam class, so it implements/reuses cam's
  fields directly. Where the Dataservice models a concept cam does not
  (Participant, Diagnosis, Phenotype, Outcome, Biospecimen, GenomicFile,
  ReadGroup, SequencingExperiment, SequencingCenter, and the various join
  entities), the KF class is_a KFRecord only.
license: MIT
see_also:
  - https://carrollaboratory.github.io/kf-access-model

prefixes:
  kf_access_model: https://w3id.org/carrollaboratory/kf-access-model/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
  cam: https://includedcc.org/common-access-model/
 # subset of CDC Race and Ethnicity Code Set Version 1.0
  cdc_race_eth: urn:oid:2.16.840.1.113883.6.238/
  hl7_null: http://terminology.hl7.org/CodeSystem/v3-NullFlavor/
  ig_dob_method: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/research-data-date-of-birth-method/
  igcondtype: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/condition-type/
  ig2dac: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/research-data-access-code/
  ig2dat: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/research-data-access-type/
  ig2_biospecimen_availability: https://nih-ncpi.github.io/ncpi-fhir-ig-2/CodeSystem/biospecimen-availability/
  snomed_ct: http://snomed.info/id/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  mesh: http://id.nlm.nih.gov/mesh/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  DUO: http://purl.obolibrary.org/obo/DUO_
  loinc: https://loinc.org/
  KIN: http://purl.org/ga4gh/kin.owl#

default_prefix: kf_access_model
default_range: string

imports:
  - linkml:types
  - common_access_model/src/common_access_model/schema/common_access_model

classes:
  KFRecord:
    title: Kids First Record
    description: >-
      One row/entity in the Kids First Dataservice, representing a single record with its kf_id and visibility fields.
    mixin: true
    slots:
      - kf_id
      - kf_entity_type
      - visible
      - visibility_comment
      - visibility_reason
    slot_usage:
      kf_id:
        required: true
        identifier: true
      kf_entity_type:
        required: true

  KFInvestigator:
    title: Investigator
    description: >-
      An individual who made contributions to the collection, analysis, or sharing of data
    is_a: Investigator
    mixins:
      - KFRecord

  KFStudy:
    title: Study
    description: >-
      Study metadata. 
    is_a: Study
    mixins:
      - KFRecord
    slots:
      - data_access_authority
      - investigator_id
      - name
      - short_name
      - version
      - file_version_descriptor
      - attribution
      - category
      - status
    slot_usage:
      parent_study:
        description: The parent KFStudy for this study, if it is a nested study.
        range: KFStudy
      principal_investigator:
        description: The KFInvestigator(s) responsible for the study.
        range: KFInvestigator
      contact:
        description: The KFInvestigator(s) to contact with questions about this study.
        range: KFInvestigator

  KFFamily:
    title: Family
    description: >-
      A group of individuals of some relation who are grouped together in
      a study. 
    is_a: Family
    mixins:
      - KFRecord

  KFParticipant:
    title: Participant
    description: >-
      A study participant. Combines the roles of cam:Subject and
      cam:Demographics into a single record, matching the Kids First
      Dataservice's participants entity. No mixin is used here because
      the Dataservice's own fields (gender, race, ethnicity, species
      recorded directly on the participant) don't line up cleanly with
      cam:Subject/cam:Demographics's required fields (subject_type, sex).
    is_a: KFRecord
    slots:
      - family_id
      - is_proband
      - ethnicity
      - gender
      - race
      - affected_status
      - species

  KFFamilyRelationship:
    title: Family Relationship
    description: >-
      A relationship between two Participants. is_a KFRecord and mixins
      (implements) cam:FamilyRelationship. The Dataservice models
      relationships as directed pairs of Participants rather than cam's
      family_member_id/subject_id pairing, so those fields are added
      alongside (rather than in place of) the mixed-in cam slots.
    is_a: FamilyRelationship
    mixins:
      - KFRecord
    slots:
      - participant1_id
      - participant2_id
      - participant1_to_participant2_relation
    slot_usage:
      participant1_id:
        required: true

  KFDiagnosis:
    title: Diagnosis
    description: A diagnosis event or assertion recorded for a Participant.
    is_a: KFRecord
    slots:
      - participant_id
      - source_text_diagnosis
      - age_at_event_days
      - source_text_tumor_location
      - mondo_id_diagnosis
      - icd_id_diagnosis
      - uberon_id_tumor_location
      - ncit_id_diagnosis
      - spatial_descriptor
      - diagnosis_category
    slot_usage:
      participant_id:
        required: true
      source_text_diagnosis:
        required: true

  KFPhenotype:
    title: Phenotype
    description: >-
      A phenotypic feature observed (or explicitly not observed) for a
      Participant.
    is_a: KFRecord
    slots:
      - participant_id
      - source_text_phenotype
      - observed
      - age_at_event_days
      - hpo_id_phenotype
      - snomed_id_phenotype
    slot_usage:
      participant_id:
        required: true
      source_text_phenotype:
        required: true
      observed:
        required: true

  KFOutcome:
    title: Outcome
    description: The latest recorded vital-status outcome for a Participant.
    is_a: KFRecord
    slots:
      - participant_id
      - disease_related
      - age_at_event_days
      - vital_status
    slot_usage:
      participant_id:
        required: true
      vital_status:
        required: true

  KFSample:
    title: Sample
    description: >-
      A grouping of Biospecimens collected from a Participant at the same
      event. is_a KFRecord and mixins (implements) cam:Sample, adding the
      fields the Dataservice's samples entity actually carries.
    is_a: Sample
    mixins:
      - KFRecord
    slots:
      - participant_id
      - age_at_event_days
      - anatomical_location
      - method_of_sample_procurement
      - preservation_method
      - sample_event_key
      - tissue_type
      - volume_ul
    slot_usage:
      parent_sample_id:
        description: KFSample from which this sample is derived.
        range: KFSample
      study_id:
        required: true
      participant_id:
        required: true

  KFSampleRelationship:
    title: Sample Relationship
    description: A parent/child derivation relationship between two Samples.
    is_a: KFRecord
    slots:
      - parent_id
      - child_id
      - external_parent_id
      - external_child_id
      - notes
    slot_usage:
      child_id:
        required: true

  KFBiospecimen:
    title: Biospecimen
    description: >-
      A specific specimen/aliquot derived from a Sample, carrying
      material, consent, and shipment details. Distinct from cam:Aliquot
      to preserve the Dataservice's own field set.
    is_a: KFRecord
    slots:
      - external_aliquot_id
      - sequencing_center_id
      - participant_id
      - kf_sample_id
      - external_sample_id
      - source_text_tissue_type
      - composition
      - source_text_anatomical_site
      - age_at_event_days
      - source_text_tumor_descriptor
      - ncit_id_tissue_type
      - ncit_id_anatomical_site
      - uberon_id_anatomical_site
      - spatial_descriptor
      - shipment_origin
      - shipment_date
      - analyte_type
      - concentration_mg_per_ml
      - volume_ul
      - specimen_status
      - method_of_sample_procurement
      - dbgap_consent_code
      - consent_type
    slot_usage:
      study_id:
        required: true
      participant_id:
        required: true
      external_aliquot_id:
        required: true

  KFGenomicFile:
    title: Genomic File
    description: >-
      A data file generated by or associated with sequencing. Distinct
      from cam:File to preserve the Dataservice's own field set.
    is_a: KFRecord
    slots:
      - file_name
      - file_format
      - data_type
      - availability
      - controlled_access
      - is_harmonized
      - hashes
      - size
      - urls
      - acl
      - authz
      - reference_genome
      - workflow_type
      - workflow_tool
      - workflow_version
      - data_category
      - file_version_descriptor
    slot_usage:
      study_id:
        required: true
      data_type:
        description: The type of data within this file.
        range: EnumGenomicFileDataType
      availability:
        description: Is or was this file available to users?
        range: EnumGenomicFileAvailability

  KFReadGroup:
    title: Read Group
    description: Sequencing read group (flow cell / lane) metadata.
    is_a: KFRecord
    slots:
      - flow_cell
      - lane_number
      - quality_scale
    slot_usage:
      study_id:
        required: true
      flow_cell:
        required: true
      lane_number:
        required: true

  KFSequencingCenter:
    title: Sequencing Center
    description: An organization that performs sequencing for a study.
    is_a: KFRecord
    slots:
      - name

  KFSequencingExperiment:
    title: Sequencing Experiment
    description: A sequencing experiment performed on a Biospecimen.
    is_a: KFRecord
    slots:
      - sequencing_center_id
      - library_name
      - experiment_date
      - experiment_strategy
      - library_strand
      - library_prep
      - library_selection
      - is_paired_end
      - platform
      - instrument_model
      - max_insert_size
      - mean_insert_size
      - mean_depth
      - total_reads
      - mean_read_length
      - target_capture_kit
      - read_pair_number
      - is_adapter_trimmed
      - adapter_sequencing
    slot_usage:
      study_id:
        required: true
      sequencing_center_id:
        required: true

  KFBiospecimenGenomicFile:
    title: Biospecimen Genomic File
    description: Links a Biospecimen to a GenomicFile it produced.
    is_a: KFRecord
    slots:
      - biospecimen_id
      - genomic_file_id
    slot_usage:
      biospecimen_id:
        required: true
      genomic_file_id:
        required: true

  KFBiospecimenDiagnosis:
    title: Biospecimen Diagnosis
    description: Links a Biospecimen to a Diagnosis it is associated with.
    is_a: KFRecord
    slots:
      - biospecimen_id
      - diagnosis_id
    slot_usage:
      biospecimen_id:
        required: true
      diagnosis_id:
        required: true

  KFReadGroupGenomicFile:
    title: Read Group Genomic File
    description: Links a ReadGroup to a GenomicFile it produced.
    is_a: KFRecord
    slots:
      - read_group_id
      - genomic_file_id
    slot_usage:
      read_group_id:
        required: true
      genomic_file_id:
        required: true

  KFSequencingExperimentGenomicFile:
    title: Sequencing Experiment Genomic File
    description: Links a SequencingExperiment to a GenomicFile it produced.
    is_a: KFRecord
    slots:
      - sequencing_experiment_id
      - genomic_file_id
    slot_usage:
      sequencing_experiment_id:
        required: true
      genomic_file_id:
        required: true

slots:

  # --- identity / access control (KFRecord) ---
  kf_id:
    title: KF ID
    description: >-
      Kids First Dataservice identifier for this record, eg, PT_00000000.
    range: string
    pattern: "^[A-Z]{2}_[A-Z0-9]{8}$"
  kf_entity_type:
    title: KF Entity Type
    description: The type of entity this record was pulled from in the Kids First dataservice.
    range: EnumKFEntityType
  visible:
    title: Visible
    description: >-
      Whether this record is visible/released, per Kids First Dataservice
      access control.
    range: boolean
  visibility_comment:
    title: Visibility Comment
    description: Free-text explanation supporting visibility_reason.
    range: string
  visibility_reason:
    title: Visibility Reason
    description: The reason this record is or is not visible.
    range: EnumVisibilityReason

  # --- Study ---
  data_access_authority:
    title: Data Access Authority
    description: >-
      The authority governing access to this study's data, eg, dbGaP.
    range: EnumDataAccessAuthority
  investigator_id:
    title: Investigator ID
    description: The primary Investigator for this study.
    range: KFInvestigator
  short_name:
    title: Short Name
    description: A short name for the study.
    range: string
  version:
    title: Version
    description: The version of this study's data.
    range: string
  file_version_descriptor:
    title: File Version Descriptor
    description: >-
      A descriptor distinguishing this record's data version from others.
    range: string
  attribution:
    title: Attribution
    description: Text describing how to attribute use of this study's data.
    range: string
  category:
    title: Study Category
    description: The broad category of research this study addresses.
    range: EnumStudyCategory
  status:
    title: Study Status
    description: The processing/release status of this study.
    range: EnumStudyStatus

  # --- Participant ---
  is_proband:
    title: Is Proband
    description: Whether this Participant is the proband of their Family.
    range: boolean
  gender:
    title: Gender
    description: >-
      Participant gender, as reported by the source study. See also
      cam:sex, which uses a different (NCIT-coded) value set.
    range: EnumGender
  affected_status:
    title: Affected Status
    description: >-
      Whether the Participant is affected by the condition(s) under study.
    range: boolean
  species:
    title: Species
    description: The species of the Participant.
    range: EnumSpecies
  participant_id:
    title: Participant ID
    description: The Participant this record is associated with.
    range: KFParticipant
  participant1_id:
    title: Participant 1 ID
    description: The first Participant in a pairwise family relationship.
    range: KFParticipant
  participant2_id:
    title: Participant 2 ID
    description: >-
      The second Participant in a pairwise family relationship - the
      relationship target, ie, participant1 <relation> participant2.
    range: KFParticipant
  participant1_to_participant2_relation:
    title: Participant 1 to Participant 2 Relation
    description: The family relationship of participant1 to participant2.
    range: EnumFamilyRelationshipKF

  # --- Diagnosis / Phenotype / Outcome ---
  age_at_event_days:
    title: Age at Event (days)
    description: >-
      The age in days of the Participant at the time of this event.
    range: integer
    unit:
      ucum_code: d
  source_text_diagnosis:
    title: Source Text Diagnosis
    description: The diagnosis as reported by the source study.
    range: string
  source_text_tumor_location:
    title: Source Text Tumor Location
    description: The tumor location as reported by the source study.
    range: string
  mondo_id_diagnosis:
    title: MONDO ID Diagnosis
    description: The MONDO ontology term for this diagnosis.
    range: uriorcurie
  icd_id_diagnosis:
    title: ICD ID Diagnosis
    description: The ICD ontology term for this diagnosis.
    range: uriorcurie
  uberon_id_tumor_location:
    title: UBERON ID Tumor Location
    description: The UBERON ontology term for the tumor location.
    range: uriorcurie
  ncit_id_diagnosis:
    title: NCIT ID Diagnosis
    description: The NCIT ontology term for this diagnosis.
    range: uriorcurie
  spatial_descriptor:
    title: Spatial Descriptor
    description: Additional spatial/location qualifiers for this record.
    range: string
  diagnosis_category:
    title: Diagnosis Category
    description: The broad category of this diagnosis.
    range: string
  source_text_phenotype:
    title: Source Text Phenotype
    description: The phenotype as reported by the source study.
    range: string
  observed:
    title: Observed
    description: >-
      Whether the phenotype was observed (present) or not observed
      (absent).
    range: EnumPresentAbsent
  hpo_id_phenotype:
    title: HPO ID Phenotype
    description: The Human Phenotype Ontology term for this phenotype.
    range: uriorcurie
  snomed_id_phenotype:
    title: SNOMED ID Phenotype
    description: The SNOMED CT term for this phenotype.
    range: uriorcurie
  disease_related:
    title: Disease Related
    description: >-
      Whether this Outcome is related to the disease(s) under study.
    range: EnumOutcomeDiseaseRelated

  # --- Sample / Biospecimen ---
  anatomical_location:
    title: Anatomical Location
    description: >-
      The anatomical site this Sample was collected from, as reported by
      the source study.
    range: string
  method_of_sample_procurement:
    title: Method of Sample Procurement
    description: The method used to procure the sample.
    range: EnumSampleProcurement
  preservation_method:
    title: Preservation Method
    description: The method used to preserve the sample.
    range: string
  sample_event_key:
    title: Sample Event Key
    description: >-
      An identifier grouping Biospecimens collected during the same event.
    range: string
  tissue_type:
    title: Tissue Type
    description: The type of tissue this Sample represents.
    range: EnumTissueType
  volume_ul:
    title: Volume (uL)
    description: The volume of the specimen, in microliters.
    range: float
    unit:
      ucum_code: uL
  parent_id:
    title: Parent Sample ID
    description: The KFSample from which this KFSample was derived.
    range: KFSample
    inlined: false
  child_id:
    title: Child Sample ID
    description: The KFSample that was derived from the parent KFSample.
    range: KFSample
    inlined: false
  external_parent_id:
    title: External Parent ID
    description: The submitter-provided identifier for the parent Sample.
    range: string
  external_child_id:
    title: External Child ID
    description: The submitter-provided identifier for the child Sample.
    range: string
  notes:
    title: Notes
    description: Free-text notes about this record.
    range: string
  external_aliquot_id:
    title: External Aliquot ID
    description: >-
      The submitter-provided identifier for this Biospecimen/aliquot.
    range: string
  sequencing_center_id:
    title: Sequencing Center ID
    description: The sequencing center associated with this record.
    range: KFSequencingCenter
  kf_sample_id:
    title: Sample ID
    description: The KFSample this Biospecimen belongs to.
    range: KFSample
  external_sample_id:
    title: External Sample ID
    description: >-
      The submitter-provided identifier for the Sample this Biospecimen
      belongs to.
    range: string
  source_text_tissue_type:
    title: Source Text Tissue Type
    description: The tissue type as reported by the source study.
    range: string
  composition:
    title: Composition
    description: The material composition of the specimen.
    range: EnumSpecimenComposition
  source_text_anatomical_site:
    title: Source Text Anatomical Site
    description: >-
      The anatomical site of collection, as reported by the source study.
    range: string
  source_text_tumor_descriptor:
    title: Source Text Tumor Descriptor
    description: >-
      The tumor descriptor (eg, Primary, Metastatic) as reported by the
      source study.
    range: string
  ncit_id_tissue_type:
    title: NCIT ID Tissue Type
    description: The NCIT ontology term for the tissue type.
    range: uriorcurie
  ncit_id_anatomical_site:
    title: NCIT ID Anatomical Site
    description: The NCIT ontology term for the anatomical site.
    range: uriorcurie
  uberon_id_anatomical_site:
    title: UBERON ID Anatomical Site
    description: The UBERON ontology term for the anatomical site.
    range: uriorcurie
  shipment_origin:
    title: Shipment Origin
    description: The origin location of the specimen shipment.
    range: string
  shipment_date:
    title: Shipment Date
    description: The date the specimen was shipped.
    range: date
  analyte_type:
    title: Analyte Type
    description: The type of analyte extracted from the specimen.
    range: EnumAnalyte
  concentration_mg_per_ml:
    title: Concentration (mg/mL)
    description: The concentration of the analyte, in mg/mL.
    range: float
    unit:
      ucum_code: mg/mL
  specimen_status:
    title: Specimen Status
    description: Whether the specimen is available for further analysis.
    range: EnumAvailabilityStatus
  dbgap_consent_code:
    title: dbGaP Consent Code
    description: >-
      The dbGaP-style consent short name/code for this specimen.
    range: string
  consent_type:
    title: Consent Type
    description: >-
      The Data Use Ontology-style consent short name for this specimen.
    range: EnumConsentType

  # --- Genomic File ---
  file_name:
    title: File Name
    description: The name of the file.
    range: string
  file_format:
    title: File Format
    description: The format of the file.
    range: EnumGenomicFileFormat
  controlled_access:
    title: Controlled Access
    description: Whether access to this file is controlled.
    range: boolean
  is_harmonized:
    title: Is Harmonized
    description: Whether this file was produced by a harmonization workflow.
    range: boolean
  hashes:
    title: Hashes
    description: Content hashes for this file.
    range: FileHash
    multivalued: true
  urls:
    title: URLs
    description: The location(s) of this file.
    range: uri
    multivalued: true
  acl:
    title: ACL
    description: Deprecated access control list for this file. See authz.
    range: string
    multivalued: true
  authz:
    title: Authz
    description: >-
      The access control identifiers (eg, dbGaP phs accessions) that gate
      access to this file.
    range: string
    multivalued: true
  reference_genome:
    title: Reference Genome
    description: >-
      The reference genome build this file is aligned to or was generated
      against.
    range: EnumReferenceGenome
  workflow_type:
    title: Workflow Type
    description: >-
      The type of workflow that produced this file. (Kids First
      Dataservice field: worflow_type)
    range: string
  workflow_tool:
    title: Workflow Tool
    description: >-
      The tool used by the workflow that produced this file. (Kids First
      Dataservice field: worflow_tool)
    range: string
  workflow_version:
    title: Workflow Version
    description: The version of the workflow tool used to produce this file.
    range: string

  # --- Read Group / Sequencing Experiment ---
  flow_cell:
    title: Flow Cell
    description: The flow cell identifier for this read group.
    range: string
  lane_number:
    title: Lane Number
    description: The lane number for this read group.
    range: integer
  quality_scale:
    title: Quality Scale
    description: The quality score scale used for this read group.
    range: EnumReadGroupQualityScale
  library_name:
    title: Library Name
    description: The name of the sequencing library.
    range: string
  experiment_date:
    title: Experiment Date
    description: The date the sequencing experiment was performed.
    range: date
  experiment_strategy:
    title: Experiment Strategy
    description: The sequencing strategy used.
    range: EnumSequencingStrategy
  library_strand:
    title: Library Strand
    description: The strandedness of the sequencing library.
    range: EnumLibraryStrand
  library_prep:
    title: Library Prep
    description: The library preparation method used.
    range: EnumLibraryPrep
  library_selection:
    title: Library Selection
    description: The library selection method used.
    range: EnumLibrarySelection
  is_paired_end:
    title: Is Paired End
    description: Whether the sequencing reads are paired-end.
    range: boolean
  platform:
    title: Platform
    description: The sequencing platform used.
    range: EnumSequencingPlatform
  instrument_model:
    title: Instrument Model
    description: The sequencing instrument model used.
    range: EnumSequencingInstrument
  max_insert_size:
    title: Max Insert Size
    description: The maximum insert size, in base pairs.
    range: integer
  mean_insert_size:
    title: Mean Insert Size
    description: The mean insert size, in base pairs.
    range: float
  mean_depth:
    title: Mean Depth
    description: The mean sequencing depth of coverage.
    range: float
  total_reads:
    title: Total Reads
    description: The total number of reads generated.
    range: integer
  mean_read_length:
    title: Mean Read Length
