classes:
  Any:
      class_uri: linkml:Any
  Record:
    description: One row / entity within the dataservice
    title: Record
    mixin: true
    slots:
    - external_id
    - access_policy_id
    - study_id

  AccessPolicy:
    title: Access Policy
    description: The access policy that describes the controls around use of
      data
    slots:
      - access_policy_id
      - data_use_accession
      - data_use_permission
      - data_use_modifier
      - disease_limitation
      - access_description
      - website
    slot_usage:
      access_policy_id:
      # KF does not currently have Consent resources in our FHIR server
        range: coGlobalID
        required: true
        identifier: true

  Study:
    title: Research Study 
    description: Study Metadata 
    mixins: Record
    slots: 
      - parent_study 
      - study_title
      - study_code
      - study_short_name
      - program
      - funding_source
      - principal_investigator 
      - contact
      - study_description
      - website
      # - publication
      - acknowledgments
      - citation_statement
      # - do_id

      # KF fields
      # - data_access_authority -- always mapped to dbGaP in KF
      - version
      - attribution
      - domain
      - status
    slot_usage:
      parent_study:
        description: The parent Study for this study, if it is a nested study.
        range: Study
      principal_investigator:
        description: The Investigator(s) responsible for the study.
        range: Investigator
      contact:
        description: The Investigator(s) to contact with questions about this study.
        range: Investigator

  Investigator:
    title: Investigator
    description: An individual who made contributions to the collection, analysis, or sharing of data.
    mixins: Record
    slots:
      - name
      - institution
      - investigator_title
      - email

  Subject:
    title: Subject
    description: This entity is the subject about which data or references are recorded. 
      This includes the idea of a human participant in a study, a cell line, an animal model, 
      or any other similar entity.
    mixins: Record
    slots:
      - subject_id
      - subject_type
      - organism_type
      - sex
      - race
      - ethnicity
      - age_at_last_vital_status 
      - vital_status
      - age_at_first_engagement

      # KF Fields
      - family_id
      - is_proband
      - affected_status
    slot_usage:
      subject_id:
        range: ptGlobalID

  Family:
    title: Family
    description: A group of individuals of some relation who are grouped together in a study.
    mixins: Record
    slots:
    - family_id
    - family_type
    - family_description 
    - consanguinity
    - family_study_focus
    slot_usage:
      family_id:
        range: grGlobalID
  FamilyRelationship:
    title: Family Member Relationship
    description: A relationship between two Subjects. Directed as follows
     <family_member_id> <relationship> <subject_id>
     <Mother's id> <KIN:027 "isBiologicalMotherOf"> <subject_id> 
    mixins: Record
    slots:
    - family_relationship_id
    - family_member_id
    - relation
    - subject_id
    slot_usage:
      family_relationship_id:
        range: fmGlobalID
      subject_id:
        required: true
        description: The family member Subject who is the relationship "object".

  SubjectAssertion:
    title: Subject Assertion 
    description: Assertion about a particular Subject. Diagnoses, Phenotypes, and other clinical observations can be recorded as Subject Assertions.
    mixins: Record 
    slots:
      - assertion_id
      - subject_id
      # - encounter_id
      - assertion_provenance
      - age_at_assertion
      - age_at_event
      - age_at_resolution
      - concept
      - concept_source
      - value_concept
      - value_number
      - value_source
      - value_unit
      - value_unit_source
    slot_usage:
      assertion_id:
        range: obGlobalID
        any_of:
         - range: deGlobalID
         - range: msGlobalID

# Added new class for KF Assertion to allow for values relateed to tumor/cancer data
  KFSubjectAssertion:
    title: Subject Assertion
    description: A Subject Assertion recorded for a Participant.
    mixins: SubjectAssertion
    slots:
      - source_text_tumor_location
      - uberon_id_tumor_location
      - spatial_descriptor
      - diagnosis_category
      - disease_related
      - vital_status
  Concept:
    title: Concept
    description: A standardized concept with display information.
    slots:
      - concept_curie 
      - display
    slot_usage:
      concept_curie:
        required: true
        identifier: true

  Sample:
    title: Sample 
    description: A grouping of Biospecimens collected from a Participant at the same event.
    mixins: Record
    slots: 
      - sample_id
      - biospecimen_collection_id 
      - parent_sample_id 
      - sample_type
      - processing 
      - availablity_status 
      - storage_method 
      - quantity_number
      - quantity_unit 
    slot_usage:
      sample_id:
        range: bsGlobalID
      biospecimen_collection_id:
        description: Biospecimen Collection during which this sample was generated.

  BiospecimenCollection:
    title: BiospecimenCollection
    description: A biospecimen collection event which yields one or more Samples.
    mixins: Record 
    slots: 
      - biospecimen_collection_id
      - age_at_collection
      - method 
      - site 
      - spatial_qualifier 
      - laterality 
      # - encounter_id
    slot_usage:
      biospecimen_collection_id:
        range: string

  Aliquot:
    title: Aliquot
    description: A specific specimen/aliquot derived from a Sample, carrying
      material, consent, and shipment details.
    mixins: Record 
    slots: 
      - aliquot_id
      - sample_id
      - availablity_status
      - quantity_number
      - quantity_unit 
      - concentration_number
      - concentration_unit

      # KF Fields
      - has_matched_normal_sample
      - cell_entity
      - external_aliquot_id
      - sequencing_center_id
      - subject_id
      - external_sample_id
      - source_text_tissue_type
      - composition
      # - source_text_anatomical_site
      # - age_at_event_days
      - source_text_tumor_descriptor
      - ncit_id_tissue_type
      - ncit_id_anatomical_site
      - uberon_id_anatomical_site
      - spatial_descriptor
      - shipment_origin
      - shipment_date
      - analyte_type
      # - concentration_mg_per_ml
      # - volume_ul
      - specimen_status
      # - method_of_sample_procurement
      - dbgap_consent_code
      - consent_type
    slot_usage:
      aliquot_id:
        range: string

  GenomicFile:
    title: File
    description: A data file generated by or associated with sequencing. 
    mixins: Record 
    slots: 
      - file_id
      - subject_id
      - sample_id
      - filename
      - format
      - file_extension
      - data_category
      - data_type
      - format
      - size
      - internal_uri 
      - release_uri
      - drs_uri
      - storage_class 
      - hash
      - availability
      # KF Fields
      - controlled_access
      - is_harmonized
      - acl
      - authz
      - reference_genome
      - workflow_type
      - workflow_tool
      - workflow_version
      - file_version_descriptor
    slot_usage:
      file_id:
        range: drGlobalID
      subject_id:
        multivalued: true
      sample_id:
        multivalued: true
      data_type:
        description: The type of data within this file.
        range: EnumGenomicFileDataType
      availability:
        description: Is or was this file available to users?
        range: EnumGenomicFileAvailability
  
  FileHash:
    title: File Hash
    description: Type and value of a file content hash.
    slots:
      - hash_type
      - hash_value

  Assay:
    title: Assay
    description: A specific assay that was performed on given subject(s) or sample(s).
    mixins: Record 
    slots: 
      - assay_id
      - subject_id
      - sample_id
      - file_id
      - assay_type
      - assay_source
    slot_usage:
      assay_id:
        range: diGlobalID
      file_id:
        multivalued: true
      subject_id:
        multivalued: true
      sample_id:
        multivalued: true
      assay_type:
        required: true

# Created a new class for SequencingAssay to allow for sequencing-specific metadata to be captured
  SequencingAssay:
    title: Sequencing Experiment Assay
    description: A sequencing experiment performed on a Biospecimen.
    mixins: Assay
    slots:
      - sequencing_center_id
      - library_name
      - experiment_date
      - experiment_strategy
      - library_strand
      - library_prep
      - library_selection
      - is_paired_end
      - platform
      - instrument_model
      - max_insert_size
      - mean_insert_size
      - mean_depth
      - total_reads
      - mean_read_length
      - target_capture_kit
      - read_pair_number
      - is_adapter_trimmed
      - adapter_sequencing


  ReadGroup:
    title: Read Group
    description: Sequencing read group (flow cell / lane) metadata.
    mixins: Record
    slots:
      - file_id
      - flow_cell
      - lane_number
      - quality_scale

#  This could just be an enum
  SequencingCenter:
    title: Sequencing Center
    description: An organization that performs sequencing for a study.
    mixins: Record
    slots:
      - name

  

