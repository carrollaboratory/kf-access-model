  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  EnumVisibilityReason:
    name: EnumVisibilityReason
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumVisibilityReason
    description: Reasons a Kids First Dataservice record is or is not visible/ released,
      from kf_lib_data_ingest.common.constants.COMMON.VISIBILITY_REASON.
    title: Visibility Reason
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      ready:
        text: ready
        title: Ready For Release
      pre_release:
        text: pre_release
        title: Pre-Release
      sample_issue:
        text: sample_issue
        title: Sample Issue
      consent_hold:
        text: consent_hold
        title: Consent Hold
      sequencing_quality:
        text: sequencing_quality
        title: Sequencing Quality Issue
  EnumDataAccessAuthority:
    name: EnumDataAccessAuthority
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumDataAccessAuthority
    description: Authorities that can govern access to a study's data, from kf_lib_data_ingest.common.constants.AUTHORITY.
    title: Data Access Authority
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      dbgap:
        text: dbgap
        title: dbGaP
  EnumStudyDomain:
    name: EnumStudyDomain
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumStudyDomain
    description: Broad categories of research a study addresses, from kf_lib_data_ingest.common.constants.STUDY.
    title: Study Domain
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      cancer:
        text: cancer
        title: Cancer
      structural_defect:
        text: structural_defect
        title: Structural Birth Defect
      structural_defect_and_cancer:
        text: structural_defect_and_cancer
        title: Structural Birth Defect and Cancer
  EnumStudyStatus:
    name: EnumStudyStatus
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumStudyStatus
    description: Processing/release status of a study, from kf_lib_data_ingest.common.constants.STUDY.STATUS.
    title: Study Status
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      canceled:
        text: canceled
        title: Canceled
      failed:
        text: failed
        title: Failed
      pending:
        text: pending
        title: Pending
      published:
        text: published
        title: Published
      publishing:
        text: publishing
        title: Publishing
      running:
        text: running
        title: Running
      staged:
        text: staged
        title: Staged
      waiting:
        text: waiting
        title: Waiting
  EnumNull:
    name: EnumNull
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumNull
    description: Base enumeration providing null options.
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      unknown:
        text: unknown
        meaning: NCIT:C17998
        title: Unknown
  EnumConsanguinityAssertion:
    name: EnumConsanguinityAssertion
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumConsanguinityAssertion
    description: Asserts known or suspected consanguinity in this study family
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      not_suspected:
        text: not_suspected
        description: Not suspected
        meaning: snomedct:428263003
        title: not-suspected
      suspected:
        text: suspected
        description: Suspected
        meaning: snomedct:415684004
        title: suspected
      known_present:
        text: known_present
        description: Known Present
        meaning: snomedct:410515003
        title: known-present
      unknown:
        text: unknown
        description: Unknown
        meaning: snomedct:261665006
        title: unknown
  EnumAssertionProvenance:
    name: EnumAssertionProvenance
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumAssertionProvenance
    description: Possible data sources for assertions.
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: EnumNull
    permissible_values:
      medical_record:
        text: medical_record
        description: Data obtained from a medical record
        title: Medical Record
      investigator_assessment:
        text: investigator_assessment
        description: Data obtained by examination, interview, etc. with investigator
        title: Investigator Assessment
      participant_or_caregiver_report:
        text: participant_or_caregiver_report
        description: Data obtained from survey, questionnaire, etc. filled out by
          participant or caregiver
        title: Participant or Caregiver Report
      other:
        text: other
        description: Data obtained from other source, such as tissue bank
        title: Other
  EnumOutcomeDiseaseRelated:
    name: EnumOutcomeDiseaseRelated
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumOutcomeDiseaseRelated
    description: Whether an Outcome is related to the disease(s) under study, from
      kf_lib_data_ingest.common.constants.OUTCOME.DISEASE_RELATED.
    title: Outcome Disease Related
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      'True':
        text: 'True'
        title: 'Yes'
      'False':
        text: 'False'
        title: 'No'
  EnumConsentType:
    name: EnumConsentType
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/EnumConsentType
    description: Data Use Ontology-style consent short names used by Kids First, from
      kf_lib_data_ingest.common.constants.CONSENT_TYPE.
    title: Consent Type
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    permissible_values:
      DS-OBDR-MDS:
        text: DS-OBDR-MDS
        description: Disease-Specific (Orofacial birth defects and related phenotypes,
          MDS). Use of the data must be related to Orofacial birth defects and related
          phenotypes; includes methods development research.
        title: DS-OBDR-MDS
      DS-OBD-MDS:
        text: DS-OBD-MDS
        description: Disease-Specific (Orofacial birth defects, MDS). Use of the data
          must be related to Orofacial birth defects; includes methods development
          research.
        title: DS-OBD-MDS
      DS-OC-PUB-MDS:
        text: DS-OC-PUB-MDS
        description: Disease-Specific (Oral Clefts, PUB, MDS). Use of the data must
          be related to Oral Clefts; requestor agrees to make results publicly available;
