classes:
  KFRecord:
    name: KFRecord
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFRecord
    description: Abstract base for every record sourced from the Kids First Dataservice.
      is_a cam:Record (external_id, access_policy_id, study_id), adding the Dataservice's
      own kf_id identifier and its per-record visibility/access-control fields. Concrete
      classes below are is_a KFRecord and, where a matching common-access-model class
      exists, also mixin that class to implement/reuse its fields.
    title: Kids First Record
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: Record
    abstract: true
    slots:
    - external_id
    - access_policy_id
    - study_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    slot_usage:
      kf_id:
        name: kf_id
        identifier: true
        required: true
    class_uri: kf_access_model:KFRecord
  KFInvestigator:
    name: KFInvestigator
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFInvestigator
    description: An individual who made contributions to the collection, analysis,
      or sharing of data. is_a KFRecord and mixins (implements) cam:Investigator,
      so it inherits name, institution, investigator_title, and email directly from
      cam.
    title: Investigator
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    mixins:
    - Investigator
    slots:
    - external_id
    - access_policy_id
    - study_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - name
    - institution
    - investigator_title
    - email
    class_uri: kf_access_model:KFInvestigator
  KFStudy:
    name: KFStudy
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFStudy
    description: Study metadata. is_a KFRecord and mixins (implements) cam:Study,
      adding the Dataservice's own fields on top.
    title: Study
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    mixins:
    - Study
    slots:
    - external_id
    - access_policy_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - data_access_authority
    - investigator_id
    - name
    - short_name
    - version
    - file_version_descriptor
    - attribution
    - category
    - status
    - KFStudy_study_id
    - KFStudy_parent_study
    - KFStudy_principal_investigator
    - KFStudy_contact
    - study_title
    - study_code
    - study_short_name
    - program
    - funding_source
    - study_description
    - website
    - publication
    - acknowledgments
    - citation_statement
    - do_id
    slot_usage:
      study_id:
        name: study_id
        description: Overridden from common-access-model. Kids First studies are identified
          by kf_id (see KFRecord); this mixed-in slot is not used as the study's own
          identifier here.
        identifier: false
        range: string
        required: false
      parent_study:
        name: parent_study
        description: The parent KFStudy for this study, if it is a nested study.
        range: KFStudy
      principal_investigator:
        name: principal_investigator
        description: The KFInvestigator(s) responsible for the study.
        range: KFInvestigator
      contact:
        name: contact
        description: The KFInvestigator(s) to contact with questions about this study.
        range: KFInvestigator
    class_uri: kf_access_model:KFStudy
  KFFamily:
    name: KFFamily
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFFamily
    description: A group of individuals of some relation who are grouped together
      in a study. is_a KFRecord and mixins (implements) cam:Family.
    title: Family
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    mixins:
    - Family
    slots:
    - external_id
    - access_policy_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - KFFamily_family_id
    - KFFamily_study_id
    - family_type
    - family_description
    - consanguinity
    - family_study_focus
    slot_usage:
      family_id:
        name: family_id
        description: Overridden from common-access-model. Not used as this record's
          identifier in the Kids First model (see KFRecord.kf_id).
        identifier: false
        range: string
        required: false
      study_id:
        name: study_id
        required: true
    class_uri: kf_access_model:KFFamily
  KFParticipant:
    name: KFParticipant
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFParticipant
    description: A study participant. Combines the roles of cam:Subject and cam:Demographics
      into a single record, matching the Kids First Dataservice's participants entity.
      No mixin is used here because the Dataservice's own fields (gender, race, ethnicity,
      species recorded directly on the participant) don't line up cleanly with cam:Subject/cam:Demographics's
      required fields (subject_type, sex).
    title: Participant
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    slots:
    - external_id
    - access_policy_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - family_id
    - is_proband
    - ethnicity
    - gender
    - race
    - affected_status
    - species
    - KFParticipant_study_id
    slot_usage:
      study_id:
        name: study_id
        required: true
    class_uri: kf_access_model:KFParticipant
  KFFamilyRelationship:
    name: KFFamilyRelationship
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFFamilyRelationship
    description: A relationship between two Participants. is_a KFRecord and mixins
      (implements) cam:FamilyRelationship. The Dataservice models relationships as
      directed pairs of Participants rather than cam's family_member_id/subject_id
      pairing, so those fields are added alongside (rather than in place of) the mixed-in
      cam slots.
    title: Family Relationship
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    mixins:
    - FamilyRelationship
    slots:
    - external_id
    - access_policy_id
    - study_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - participant1_id
    - KFFamilyRelationship_participant2_id
    - KFFamilyRelationship_participant1_to_participant2_relation
    - KFFamilyRelationship_family_relationship_id
    - family_member_id
    - relation
    - FamilyRelationship_subject_id
    slot_usage:
      family_relationship_id:
        name: family_relationship_id
        description: Overridden from common-access-model. Not used as this record's
          identifier in the Kids First model (see KFRecord.kf_id).
        identifier: false
        range: string
        required: false
      participant2_id:
        name: participant2_id
        required: true
      participant1_to_participant2_relation:
        name: participant1_to_participant2_relation
        required: true
    class_uri: kf_access_model:KFFamilyRelationship
  KFDiagnosis:
    name: KFDiagnosis
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFDiagnosis
    description: A diagnosis event or assertion recorded for a Participant.
    title: Diagnosis
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    slots:
    - external_id
    - access_policy_id
    - study_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - KFDiagnosis_participant_id
    - KFDiagnosis_source_text_diagnosis
    - age_at_event_days
    - source_text_tumor_location
    - mondo_id_diagnosis
    - icd_id_diagnosis
    - uberon_id_tumor_location
    - ncit_id_diagnosis
    - spatial_descriptor
    - diagnosis_category
    slot_usage:
      participant_id:
        name: participant_id
        required: true
      source_text_diagnosis:
        name: source_text_diagnosis
        required: true
    class_uri: kf_access_model:KFDiagnosis
  KFPhenotype:
    name: KFPhenotype
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFPhenotype
    description: A phenotypic feature observed (or explicitly not observed) for a
      Participant.
    title: Phenotype
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    slots:
    - external_id
    - access_policy_id
    - study_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - KFPhenotype_participant_id
    - KFPhenotype_source_text_phenotype
    - KFPhenotype_observed
    - age_at_event_days
    - hpo_id_phenotype
    - snomed_id_phenotype
    slot_usage:
      participant_id:
        name: participant_id
        required: true
      source_text_phenotype:
        name: source_text_phenotype
        required: true
      observed:
        name: observed
        required: true
    class_uri: kf_access_model:KFPhenotype
  KFOutcome:
    name: KFOutcome
    definition_uri: https://w3id.org/carrollaboratory/kf-access-model/KFOutcome
    description: The latest recorded vital-status outcome for a Participant.
    title: Outcome
    from_schema: https://w3id.org/carrollaboratory/kf-access-model
    is_a: KFRecord
    slots:
    - external_id
    - access_policy_id
    - study_id
    - KFRecord_kf_id
    - visible
    - visibility_comment
    - visibility_reason
    - KFOutcome_participant_id
    - disease_related
    - age_at_event_days
